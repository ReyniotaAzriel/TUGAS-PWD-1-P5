<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Toko Reyniota - Tugas 5PWEB</title>
		<link rel="stylesheet" href="style.css" />
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	</head>
	<body>
		<div id="bagian-atas">
			<h2>Toko reyniota ganteng</h2>
			<input type="text" id="cari-barang" placeholder="Cari nama produk..." />
			<button id="tombol-keranjang">Lihat Keranjang (<span id="jumlah-di-keranjang">0</span>)</button>
		</div>

		<div id="wadah-produk"></div>

		<div id="kotak-keranjang">
			<h3>Keranjang Belanja</h3>
			<ul id="daftar-belanjaan"></ul>
			<p>
				<strong>Total: <span id="tulisan-total">Rp 0</span></strong>
			</p>
			<button id="tombol-kosongkan">Kosongkan Keranjang</button>
			<button id="tombol-bayar">Checkout</button>
		</div>

		<div id="kotak-ringkasan"></div>

		<script src="script.js"></script>
	</body>
</html>
